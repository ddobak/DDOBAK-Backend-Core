name: Deploy to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: ${{ secrets.EC2_PORT }}
        script: |
          set -e
          
          # 프로젝트 디렉토리로 이동
          cd DDOBAK-Backend-Core
          
          # 현재 Git 코드와 실행 중인 코드가 같은지 확인
          echo "=== Git Status ==="
          git status
          
          # 최신 코드 반영
          echo "=== Pulling Latest Code ==="
          git checkout dev
          git pull origin dev
          
          # 현재 실행중인 프로세스 종료
          echo "=== Stopping Java Process ==="
          pkill -f java || true
          
          # 잠시 대기 (프로세스 종료 완료 대기)
          sleep 5
          
          # 현재 실행중인 자바 프로세스 확인
          echo "=== Checking Java Processes ==="
          ps aux | grep java || true
          
          # JAR 생성 (테스트 없이)
          echo "=== Building JAR ==="
          chmod +x ./gradlew
          ./gradlew clean bootJar --stacktrace --info
          
          # 메모리 제한으로 실행
          echo "=== Starting Application ==="
          nohup java -Xmx512m -Xms256m -jar build/libs/main-server-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          
          # 애플리케이션 시작 확인
          sleep 10
          echo "=== Checking Application Start ==="
          ps aux | grep java || true
          
          echo "=== Deployment Complete ===" 
          
          # JAR 파일 존재 여부 확인
          echo "=== Checking JAR File ==="
          ls -lh build/libs/

          # 로그 출력
          echo "=== Last 20 lines of app.log ==="
          tail -n 20 app.log || true