spring:
  application:
    name: main-server
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # 데이터베이스 설정 (PostgreSQL - 공유 RDS)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ddobak_db}?currentSchema=prod
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:ddobak_user}
    password: ${DB_PASSWORD:your_password}

  # JPA 설정
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # 프로덕션에서는 스키마 검증만
    properties:
      hibernate:
        show-sql: false  # 상용에서는 쿼리 로그 비활성화
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

# 서버 설정
server:
  port: 8080

# 로깅 설정 (상용 - 최소한의 로그)
logging:
  level:
    com.sbpb.ddobak.server.common.utils.LambdaUtil: INFO
    com.sbpb.ddobak.server.domain.documentProcess.service.DocumentProcessService: INFO
    org.springframework.security: WARN
    com.sbpb.ddobak.server.domain.auth: INFO
    com.sbpb.ddobak.server.domain.auth.oauth: INFO
    com.sbpb.ddobak.server.domain.auth.service: INFO
    com.sbpb.ddobak.server.domain.auth.controller: INFO
    root: WARN

# Apple OAuth 설정 (상용)
apple:
  oauth:
    team-id: ${APPLE_TEAM_ID:TEAM_ID}
    client-id: ${APPLE_CLIENT_ID:SERVICE_ID}  
    key-id: ${APPLE_KEY_ID:KEY_ID} 
    private-key: ${APPLE_PRIVATE_KEY:PRIVATE_KEY_CONTENT}
    issuer: "https://appleid.apple.com"
    public-keys-url: "https://appleid.apple.com/auth/keys"

# JWT 설정 (상용)
jwt:
  secret: ${JWT_SECRET:CHANGE_THIS_IN_PRODUCTION_ENVIRONMENT}
  access-token-expiration: 3600000   # 1시간 (밀리초)
  refresh-token-expiration: 604800000 # 7일 (밀리초)

# AWS 설정 (상용)
aws:
  region: ap-northeast-2
  profile: ddobak
  s3:
    bucket: ddobak-service
    environment: prod  # dev/prod로 환경 구분
    service-bucket: ddobak-service  
    test-bucket: ddobak-service     
  lambda:
    ocr-function-name: ocr_lambda
    analysis-function-name: bedrock_lambda