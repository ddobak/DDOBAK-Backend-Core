spring:
  application:
    name: main-server
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # 데이터베이스 설정 (PostgreSQL - 공유 RDS)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ddobak_db}?currentSchema=dev
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:ddobak_user}
    password: ${DB_PASSWORD:your_password}

  # JPA 설정
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # DB 스키마 자동 생성
    properties:
      hibernate:
        show-sql: true  # 쿼리 로그 출력
        format_sql: true  # 쿼리 로그 포맷 (정렬)
        dialect: org.hibernate.dialect.PostgreSQLDialect

# 서버 설정
server:
  port: 8080

# 로깅 설정
logging:
  level:
    com.sbpb.ddobak.server.common.utils.LambdaUtil: DEBUG
    com.sbpb.ddobak.server.domain.documentProcess.service.DocumentProcessService: DEBUG
    org.springframework.security: DEBUG
    com.sbpb.ddobak.server.domain.auth: DEBUG
    com.sbpb.ddobak.server.domain.auth.oauth: DEBUG
    com.sbpb.ddobak.server.domain.auth.service: DEBUG
    com.sbpb.ddobak.server.domain.auth.controller: DEBUG
    org.hibernate.SQL: DEBUG  # SQL 쿼리 로그
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # SQL 파라미터 값 로그

# Apple OAuth 설정
apple:
  oauth:
    # Apple Developer
    team-id: ${APPLE_TEAM_ID:TEAM_ID}
    
    # 앱 번들 ID
    client-id: ${APPLE_CLIENT_ID:SERVICE_ID}  
    
    # Private Key (.p8 파일)의 파일명에 들어있는 ID
    key-id: ${APPLE_KEY_ID:KEY_ID} 
    
    # Private Key (.p8 파일) 내용
    private-key: ${APPLE_PRIVATE_KEY:PRIVATE_KEY_CONTENT}
    
    # Apple 고정 값 (고정)
    issuer: "https://appleid.apple.com"
    public-keys-url: "https://appleid.apple.com/auth/keys"

# JWT 설정
jwt:
  # 키 생성: openssl rand -base64 64
  secret: ${JWT_SECRET:CHANGE_THIS_IN_PRODUCTION_ENVIRONMENT}
  access-token-expiration: 7200000   # 2시간 (밀리초)
  refresh-token-expiration: 604800000 # 7일 (밀리초)

# AWS 설정 (공유 리소스 사용)
aws:
  region: ap-northeast-2
  profile: ddobak
  s3:
    bucket: ddobak-service
    environment: dev  # dev/prod로 환경 구분
    service-bucket: ddobak-service  # 기존 코드 호환성
    test-bucket: ddobak-service     # 기존 코드 호환성
  lambda:
    ocr-function-name: ocr_lambda
    analysis-function-name: bedrock_lambda
